openapi: 3.1.0
info:
  title: Classical Music Catalog API
  version: 0.1.0
tags:
  - name: composers
    description: Endpoints for managing composers.

paths:
  /v1/composers:
    get:
      tags: [composers]
      summary: List composers (offset pagination)
      description: |
        Returns a paginated list of composers. Supports filtering and sorting.
      parameters:
        - in: query
          name: q
          description: Case-insensitive search in name and aliases.
          schema: { type: string, minLength: 1 }
        - in: query
          name: era
          description: Filter by musical era.
          schema: { $ref: '#/components/schemas/Era' }
        - in: query
          name: country
          description: ISO 3166-1 alpha-2 country code (e.g., "DE", "RU").
          schema: { type: string, pattern: '^[A-Z]{2}$' }
        - in: query
          name: birth_year_gte
          schema: { type: integer, minimum: 1000, maximum: 2100 }
        - in: query
          name: birth_year_lte
          schema: { type: integer, minimum: 1000, maximum: 2100 }
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: per_page
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - in: query
          name: sort
          schema:
            type: string
            enum: [name, birth_year, death_year, created_at]
            default: name
        - in: query
          name: order
          schema:
            type: string
            enum: [asc, desc]
            default: asc
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ComposersListResponse' }
              examples:
                page1:
                  summary: First page
                  value:
                    data:
                      - id: "a55a2b9c-0f6d-4b70-8d1e-2f59f2b3c001"
                        name: "Johann Sebastian Bach"
                        era: "Baroque"
                        birth_year: 1685
                        death_year: 1750
                        country: "DE"
                        also_known_as: ["J. S. Bach"]
                        description: "German composer of the Baroque period."
                        slug: "johann-sebastian-bach"
                        created_at: "2025-09-01T12:00:00Z"
                        updated_at: "2025-09-01T12:00:00Z"
                        links: { self: "https://api.example.com/v1/composers/a55a2b9c-0f6d-4b70-8d1e-2f59f2b3c001" }
                    meta:
                      page: 1
                      per_page: 20
                      total: 253
                      total_pages: 13
                    links:
                      self: "https://api.example.com/v1/composers?page=1&per_page=20"
                      next: "https://api.example.com/v1/composers?page=2&per_page=20"
                      prev: null
                      first: "https://api.example.com/v1/composers?page=1&per_page=20"
                      last: "https://api.example.com/v1/composers?page=13&per_page=20"
    post:
      tags: [composers]
      summary: Create a composer
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ComposerCreate' }
            examples:
              createBeethoven:
                value:
                  name: "Ludwig van Beethoven"
                  era: "Classical"
                  birth_year: 1770
                  death_year: 1827
                  country: "DE"
                  also_known_as: []
                  description: "German composer and pianist."
      responses:
        '201':
          description: Created
          headers:
            Location:
              description: URL of the newly created composer.
              schema: { type: string, format: uri }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Composer' }
              examples:
                created:
                  value:
                    id: "b77c3d2e-2f59-4e51-9a70-1c2d7fa3e002"
                    name: "Ludwig van Beethoven"
                    era: "Classical"
                    birth_year: 1770
                    death_year: 1827
                    country: "DE"
                    also_known_as: []
                    description: "German composer and pianist."
                    slug: "ludwig-van-beethoven"
                    created_at: "2025-09-01T12:00:01Z"
                    updated_at: "2025-09-01T12:00:01Z"
                    links: { self: "https://api.example.com/v1/composers/b77c3d2e-2f59-4e51-9a70-1c2d7fa3e002" }
        '400':
          description: Bad Request
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              examples:
                bad_json:
                  value:
                    title: "Bad Request"
                    status: 400
                    detail: "Malformed JSON."
        '409':
          description: Conflict (unique constraint violation on name+birth_year or slug)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              examples:
                duplicate:
                  value:
                    title: "Conflict"
                    status: 409
                    detail: "Composer with the same name and birth_year already exists."
                    errors:
                      name:
                        - "must be unique in combination with birth_year"
        '422':
          description: Unprocessable Entity (validation errors)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              examples:
                validation:
                  value:
                    title: "Unprocessable Entity"
                    status: 422
                    detail: "Validation failed."
                    errors:
                      era: ["is required and must be one of the supported values"]
                      country: ["must match ^[A-Z]{2}$"]

  /v1/composers/{id}:
    get:
      tags: [composers]
      summary: Get a composer by ID
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Composer' }
              examples:
                bach:
                  value:
                    id: "a55a2b9c-0f6d-4b70-8d1e-2f59f2b3c001"
                    name: "Johann Sebastian Bach"
                    era: "Baroque"
                    birth_year: 1685
                    death_year: 1750
                    country: "DE"
                    also_known_as: ["J. S. Bach"]
                    description: "German composer and musician of the Baroque period."
                    slug: "johann-sebastian-bach"
                    created_at: "2025-09-01T12:00:00Z"
                    updated_at: "2025-09-01T12:00:00Z"
                    links: { self: "https://api.example.com/v1/composers/a55a2b9c-0f6d-4b70-8d1e-2f59f2b3c001" }
        '404':
          description: Not Found
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              examples:
                not_found:
                  value:
                    title: "Not Found"
                    status: 404
                    detail: "Composer not found."
    patch:
      tags: [composers]
      summary: Update a composer (merge-patch)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema: { $ref: '#/components/schemas/ComposerUpdate' }
            examples:
              update_country_and_alias:
                value:
                  country: "AT"
                  also_known_as: ["L. v. Beethoven"]
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Composer' }
              examples:
                updated:
                  value:
                    id: "b77c3d2e-2f59-4e51-9a70-1c2d7fa3e002"
                    name: "Ludwig van Beethoven"
                    era: "Classical"
                    birth_year: 1770
                    death_year: 1827
                    country: "AT"
                    also_known_as: ["L. v. Beethoven"]
                    description: "German composer and pianist."
                    slug: "ludwig-van-beethoven"
                    created_at: "2025-09-01T12:00:01Z"
                    updated_at: "2025-09-02T10:00:00Z"
                    links: { self: "https://api.example.com/v1/composers/b77c3d2e-2f59-4e51-9a70-1c2d7fa3e002" }
        '400':
          description: Bad Request
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              examples:
                bad_patch:
                  value:
                    title: "Bad Request"
                    status: 400
                    detail: "Invalid merge-patch document."
        '404':
          description: Not Found
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409':
          description: Conflict (e.g., updating to a duplicate name+birth_year)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              examples:
                conflict:
                  value:
                    title: "Conflict"
                    status: 409
                    detail: "Composer with the same name and birth_year already exists."
        '422':
          description: Unprocessable Entity
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
    delete:
      tags: [composers]
      summary: Delete a composer
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204':
          description: No Content
        '404':
          description: Not Found
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

components:
  schemas:
    Era:
      type: string
      enum:
        - "Baroque"
        - "Classical"
        - "Early Romantics"
        - "Nationalist Romantics"
        - "Late Romantics"
        - "20th Century"
        - "21st Century"

    Composer:
      type: object
      required: [id, name, era, created_at, updated_at]
      description: |
        `(name, birth_year)` must be unique. Enforced at the database level; surfaced as 409 Conflict.
      properties:
        id: { type: string, format: uuid, description: Server-generated UUID. }
        name:
          type: string
          minLength: 1
          description: Primary display name (e.g., "Ludwig van Beethoven").
        era:
          $ref: '#/components/schemas/Era'
        birth_year:
          type: integer
          minimum: 1000
          maximum: 2100
          nullable: true
        death_year:
          type: integer
          minimum: 1000
          maximum: 2100
          nullable: true
        country:
          type: string
          pattern: '^[A-Z]{2}$'
          description: ISO 3166-1 alpha-2 code.
          nullable: true
        also_known_as:
          type: array
          items: { type: string, minLength: 1 }
          default: []
          description: Alternative names/aliases.
        description:
          type: string
          description: Optional biographical text (Markdown allowed).
          nullable: true
        slug:
          type: string
          readOnly: true
          description: URL-friendly slug generated from the name.
        created_at: { type: string, format: date-time, readOnly: true }
        updated_at: { type: string, format: date-time, readOnly: true }
        links:
          type: object
          readOnly: true
          properties:
            self: { type: string, format: uri }

    ComposerCreate:
      type: object
      required: [name, era]
      properties:
        name: { type: string, minLength: 1 }
        era:  { $ref: '#/components/schemas/Era' }
        birth_year: { type: integer, minimum: 1000, maximum: 2100, nullable: true }
        death_year: { type: integer, minimum: 1000, maximum: 2100, nullable: true }
        country:    { type: string, pattern: '^[A-Z]{2}$', nullable: true }
        also_known_as:
          type: array
          items: { type: string, minLength: 1 }
          default: []
        description: { type: string , nullable: true}

    ComposerUpdate:
      type: object
      description: JSON Merge Patch document to update a composer.
      properties:
        name: { type: string , nullable: true}
        era: 
          $ref: '#/components/schemas/Era'
          nullable: true
        birth_year: { type: integer, minimum: 1000, maximum: 2100, nullable: true }
        death_year: { type: integer, minimum: 1000, maximum: 2100, nullable: true }
        country:    { type: string, pattern: '^[A-Z]{2}$', nullable: true }
        also_known_as:
          type: array
          nullable: true
          items: { type: string, minLength: 1 }
        description: { type: string, nullable: true}

    Problem:
      type: object
      description: RFC 7807 Problem Details
      properties:
        type:   { type: string, format: uri }
        title:  { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string, format: uri }
        errors:
          type: object
          additionalProperties:
            type: array
            items: { type: string }
      required: [title, status]

    ComposersListResponse:
      type: object
      required: [data, meta, links]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Composer' }
        meta:
          type: object
          required: [page, per_page, total, total_pages]
          properties:
            page: { type: integer, minimum: 1 }
            per_page: { type: integer, minimum: 1, maximum: 100 }
            total: { type: integer, minimum: 0 }
            total_pages: { type: integer, minimum: 0 }
        links:
          type: object
          properties:
            self:  { type: string, format: uri }
            next:  { type: string, format: uri, nullable: true}
            prev:  { type: string, format: uri, nullable: true}
            first: { type: string, format: uri, nullable: true}
            last:  { type: string, format: uri, nullable: true}
